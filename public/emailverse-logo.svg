<svg viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emailverse-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <!-- Envelope Shape -->
  <rect x="10" y="20" width="60" height="40" rx="4" ry="4" fill="url(#emailverse-gradient)" />
  
  <!-- Envelope Flap -->
  <path d="M10 20 L40 45 L70 20" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- EmailVerse Text -->
  <text x="85" y="35" fill="#374151" font-family="Arial, sans-serif" font-size="18" font-weight="700">Email</text>
  <text x="85" y="55" fill="#374151" font-family="Arial, sans-serif" font-size="18" font-weight="700">Verse</text>
</svg>